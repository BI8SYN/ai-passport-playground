name: ai-passport-playground

services:
  sdk:
    image: ai-passport-sdk:idf5.5.3
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    environment:
      IDF_CCACHE_ENABLE: "1"
      CCACHE_DIR: /cache/ccache
      CCACHE_MAXSIZE: 2G
      IDF_COMPONENT_CACHE_PATH: /cache/components
      XDG_CACHE_HOME: /cache/xdg
      PYTHONDONTWRITEBYTECODE: "1"
      IDF_GIT_SAFE_DIR: /workspace
    volumes:
      - .:/workspace
      - builds:/build
      - ccache:/cache/ccache
      - component-cache:/cache/components
      - user-cache:/cache/xdg
      - managed-upstream:/workspace/vendor/ai-passport/managed_components
      - managed-hardware-test:/workspace/firmware/hardware-test/managed_components
      - managed-rf-link-handmic:/workspace/firmware/rf-link-handmic/managed_components
      - managed-ble-signer-lab:/workspace/firmware/ble-signer-lab/managed_components
      - managed-ear-trainer:/workspace/firmware/ear-trainer/managed_components
      - managed-resistor-reader:/workspace/firmware/resistor-reader/managed_components
      - upstream-gate-artifacts:/workspace/vendor/ai-passport/build
    # Build-only by design: no devices, USB mounts, privileged mode or ports.
    command: ["python3", "tools/firmware.py", "doctor"]

  fonts:
    profiles: ["tools"]
    image: node:24-bookworm-slim@sha256:d6aa754f16b3197301076f047b5def2f02ea1dbbc2ca920407d46d7ec7f87b20
    working_dir: /workspace/tools/fonts
    volumes:
      - .:/workspace
      - font-node-modules:/workspace/tools/fonts/node_modules
      - font-npm-cache:/root/.npm
    command: ["sh", "-c", "npm ci --no-audit --no-fund && node generate.mjs"]

volumes:
  builds:
  ccache:
  component-cache:
  user-cache:
  managed-upstream:
  managed-hardware-test:
  managed-resistor-reader:
  managed-ble-signer-lab:
  managed-rf-link-handmic:
  managed-ear-trainer:
  upstream-gate-artifacts:
  font-node-modules:
  font-npm-cache:
